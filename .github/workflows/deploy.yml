name: backend-deploy

on:
  push:
    # ★임시★ phase2-backend-deploy 는 Step 1·2 검증용으로만 추가함 — 검증 끝나면 제거할 것.
    #        브랜치 push = 빌드 + GHCR push(latest+sha). 배포(AWS/SSM)는 main 전용(아래 if).
    branches: [main, phase2-backend-deploy]
  pull_request:
    branches: [main]   # PR도 빌드/이미지 검증만, 배포 스텝은 스킵(아래 if)

permissions:
  id-token: write      # OIDC (AWS assume-role)
  contents: read
  packages: write      # GHCR push

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build bootJar (러너 x86 네이티브 빌드 — QEMU 회피)
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar --no-daemon
          rm -f build/libs/*-plain.jar
          ls -la build/libs/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR 이미지 경로 소문자화 (GHCR는 소문자만 허용)
        id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push arm64 image (COPY만이라 빠름)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.img.outputs.repo }}/api:latest
            ghcr.io/${{ steps.img.outputs.repo }}/api:${{ github.sha }}

      # ---- 여기부터 배포: main push 에서만 ----
      - name: AWS OIDC 인증
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # 배포는 main 전용
        uses: aws-actions/configure-aws-credentials@v4   # 브리프의 v6은 오기(현재 최신 major는 v4)
        with:
          role-to-assume: arn:aws:iam::154667447418:role/gh-backend-deploy
          aws-region: ap-northeast-2

      - name: SSM 배포 + 완료 대기 (실패 시 워크플로 실패)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # 배포는 main 전용
        env:
          INSTANCE_ID: "i-0cda2a7683012f57c"   # 배포 대상 EC2 인스턴스
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "backend-deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["cd /srv/app && sudo bash deploy.sh"]' \
            --query "Command.CommandId" --output text)
          echo "CommandId=$CMD_ID"

          # send-command는 비동기 → 완료/실패까지 폴링하고 종료코드 전파
          STATUS=Pending
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "  status=$STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::배포 실패 ($STATUS)"
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text || true
                exit 1 ;;
            esac
            sleep 15
          done
          if [ "$STATUS" != Success ]; then
            echo "::error::배포 시간초과 (마지막 status=$STATUS)"; exit 1
          fi
          echo "---- deploy.sh 출력 ----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
