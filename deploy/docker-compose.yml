# 서버(/srv/app) 실행용. api 만 교체 가능한 구조(Phase 4에서 prometheus 등 추가 예정).
# GHCR 이미지명은 소문자여야 하므로 repo 를 소문자로 고정: u1000e/kh_portfolio_builder
services:
  api:
    image: ghcr.io/u1000e/kh_portfolio_builder/api:latest
    env_file: .env                # 배포 스크립트가 SSM에서 생성(chmod 600)
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis           # 172.17.0.1 아님 — compose 내부 DNS
      REDIS_PORT: "6379"
    depends_on: [redis]
    restart: unless-stopped
    mem_limit: 1100m              # 2GB 박스, 컨테이너별 상한
    # api 포트는 호스트에 노출하지 않는다 — Caddy만 80/443. 헬스체크는 내부 네트워크로.

  redis:
    image: redis:7-alpine
    command: ["redis-server","--maxmemory","96mb","--maxmemory-policy","allkeys-lru"]
    restart: unless-stopped
    mem_limit: 128m

  caddy:
    image: caddy:2-alpine
    ports: ["80:80","443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # 인증서 저장소 — 삭제 금지(Let's Encrypt 발급 rate limit)
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: 64m

  # ── Phase 4 모니터링 수집기 (인프라 컨테이너) ──────────────────────────
  # deploy.sh 는 `--no-deps api` 로 api만 교체하므로 아래 둘은 배포 시 재시작되지 않음.
  # 최초 1회 `docker compose up -d node-exporter alloy` 로 기동.
  node-exporter:
    image: prom/node-exporter:latest
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'   # 호스트 파일시스템 지표 수집 (읽기 전용)
    pid: host                 # 호스트 프로세스/네트워크 지표
    restart: unless-stopped
    mem_limit: 64m
    # 포트는 호스트에 노출하지 않음 — alloy가 compose 내부 DNS(node-exporter:9100)로만 접근

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    env_file: .env.alloy      # GRAFANA_CLOUD_* 전용(deploy.sh가 생성, chmod 600). api .env과 분리.
    restart: unless-stopped
    mem_limit: 128m

volumes:
  caddy_data:
  caddy_config:
  alloy_data:
